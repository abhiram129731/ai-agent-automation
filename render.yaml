services:
  - type: web
    name: tvb-lead-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: HUNTER_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
